<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>科室工作推进登记</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-icon" data-icon="clipboard-list"></span>
        <div class="brand-text">
          <h1>科室工作推进登记</h1>
          <p>年度推进台账与年终总结</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-ghost" id="reportBtn" type="button" title="年度总结">
          <span data-icon="file-text"></span><span class="btn-label">年度总结</span>
        </button>
        <div class="menu-wrap">
          <button class="btn btn-ghost" id="dataMenuBtn" type="button" title="数据">
            <span data-icon="database"></span><span class="btn-label">数据</span>
          </button>
          <div class="menu" id="dataMenu" hidden>
            <button type="button" id="exportJsonBtn"><span data-icon="download"></span>导出数据备份</button>
            <button type="button" id="importJsonBtn"><span data-icon="upload"></span>导入数据</button>
            <button type="button" id="sampleBtn"><span data-icon="sparkles"></span>载入示例数据</button>
            <button type="button" id="clearBtn"><span data-icon="trash"></span>清空数据</button>
          </div>
        </div>
        <button class="btn btn-primary" id="addBtn" type="button">
          <span data-icon="plus"></span><span class="btn-label">登记</span>
        </button>
      </div>
    </div>
  </header>

  <input type="file" id="importFile" accept=".json,application/json" hidden>

  <main id="mainView">
    <section class="summary-band">
      <div class="summary-grid">
        <div class="stat">
          <span class="stat-icon" data-icon="flag"></span>
          <div><span class="stat-label" id="statTotalLabel">本年事项</span><strong id="statTotal">0</strong></div>
        </div>
        <div class="stat">
          <span class="stat-icon" data-icon="trend-up"></span>
          <div><span class="stat-label">推进中</span><strong id="statActive">0</strong></div>
        </div>
        <div class="stat">
          <span class="stat-icon" data-icon="check"></span>
          <div><span class="stat-label">已完成</span><strong id="statDone">0</strong></div>
        </div>
        <div class="stat">
          <span class="stat-icon" data-icon="target"></span>
          <div><span class="stat-label">目标达成率</span><strong id="statRate">0%</strong></div>
        </div>
      </div>
    </section>

    <section class="toolbar">
      <div class="filter-row" id="statusFilters"></div>
      <div class="toolbar-row">
        <label class="search">
          <span data-icon="search"></span>
          <input id="searchInput" type="search" placeholder="搜索事项、负责人" autocomplete="off">
        </label>
        <label class="year-select">
          <span data-icon="calendar"></span>
          <select id="yearSelect" aria-label="选择年度"></select>
        </label>
      </div>
    </section>

    <section class="item-list" id="itemList" aria-live="polite"></section>

    <section class="empty-state" id="emptyState" hidden>
      <span class="empty-icon" data-icon="clipboard-list"></span>
      <h2>暂无登记事项</h2>
      <p>从第一项科室工作开始登记。</p>
      <button class="btn btn-primary" id="emptyAddBtn" type="button">
        <span data-icon="plus"></span><span class="btn-label">登记第一项</span>
      </button>
    </section>
  </main>

  <section id="reportView" hidden>
    <div class="report-toolbar">
      <button class="btn btn-ghost" id="backBtn" type="button">
        <span data-icon="arrow-left"></span><span class="btn-label">返回台账</span>
      </button>
      <div class="report-actions">
        <button class="btn btn-ghost" id="copyReportBtn" type="button">
          <span data-icon="copy"></span><span class="btn-label">复制总结</span>
        </button>
        <button class="btn btn-ghost" id="printReportBtn" type="button">
          <span data-icon="printer"></span><span class="btn-label">打印/PDF</span>
        </button>
        <button class="btn btn-primary" id="mdReportBtn" type="button">
          <span data-icon="download"></span><span class="btn-label">导出 Markdown</span>
        </button>
      </div>
    </div>
    <article class="report" id="reportPaper"></article>
  </section>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h2 id="modalTitle">登记工作事项</h2>
        <button class="icon-btn" id="closeModalBtn" type="button" aria-label="关闭" title="关闭">
          <span data-icon="x"></span>
        </button>
      </div>
      <form id="itemForm" class="modal-body">
        <div class="field">
          <label for="itemTitle">事项内容 <em>*</em></label>
          <input id="itemTitle" type="text" maxlength="200" required placeholder="事项名称或主要内容">
        </div>
        <div class="field-row">
          <div class="field">
            <label for="itemDate">开展日期 <em>*</em></label>
            <input id="itemDate" type="date" required>
          </div>
          <div class="field">
            <label for="itemStatus">当前状态</label>
            <select id="itemStatus"></select>
          </div>
        </div>
        <div class="field">
          <label for="itemOwner">负责人</label>
          <input id="itemOwner" type="text" placeholder="多人用、或逗号分隔">
        </div>
        <div class="field">
          <label for="itemGoal">工作目标</label>
          <textarea id="itemGoal" rows="3" placeholder="预期成果、关键指标或验收标准"></textarea>
        </div>

        <div class="field">
          <div class="section-heading">
            <label>推进时间点</label>
            <button class="btn btn-small btn-ghost" id="addEntryBtn" type="button">
              <span data-icon="plus"></span><span>添加记录</span>
            </button>
          </div>
          <div id="entryList" class="entry-list"></div>
        </div>

        <div class="field">
          <label for="itemResultStatus">最终目标达成情况</label>
          <select id="itemResultStatus"></select>
        </div>
        <div class="field">
          <label for="itemResultNote">达成情况说明</label>
          <textarea id="itemResultNote" rows="3" placeholder="结果、成效或遗留问题"></textarea>
        </div>

        <div class="modal-footer">
          <button class="btn btn-danger-outline" id="deleteBtn" type="button" hidden>
            <span data-icon="trash"></span><span>删除</span>
          </button>
          <span class="spacer"></span>
          <button class="btn btn-ghost" id="cancelBtn" type="button">取消</button>
          <button class="btn btn-primary" id="saveBtn" type="submit">
            <span data-icon="check"></span><span>保存</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="app.js"></script>
</body>
</html>
